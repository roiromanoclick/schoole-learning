<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="זיכרון באנגלית">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>משחק זיכרון באנגלית – כיתה ד׳</title>
<style>
  button { font-family:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  :root { --bg:#fff7e6; --main:#7c3aed; --ok:#16a34a; --bad:#dc2626; --ink:#1f2937; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:"Arial","Heebo",sans-serif; background:var(--bg); color:var(--ink); font-size:24px; overflow-x:hidden; }
  header { background:var(--main); color:#fff; padding:14px 20px; text-align:center; font-size:30px; font-weight:bold; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .ltr { direction:ltr; unicode-bidi:isolate; display:inline-block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .lvl { background:#fff; border:3px solid #e5e7eb; border-radius:16px; padding:16px; cursor:pointer; text-align:center; font-size:24px; }
  .lvl:hover { border-color:var(--main); transform:translateY(-2px); }
  .lvl .ic { font-size:40px; } .lvl .nm { font-weight:bold; margin:6px 0; } .lvl .best { font-size:18px; color:#6b7280; }
  .lvl.done { background:#dcfce7; border-color:var(--ok); }
  .card { background:#fff; border-radius:16px; padding:16px; box-shadow:0 2px 8px #0002; margin-bottom:14px; }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; color:#6b7280; font-size:22px; margin-bottom:12px; }
  button.menu { background:#ede9fe; color:#4c1d95; border:none; border-radius:10px; padding:8px 14px; font-size:20px; font-weight:bold; cursor:pointer; }
  button.go { background:var(--main); color:#fff; border:none; border-radius:12px; padding:12px 28px; font-size:26px; cursor:pointer; margin-top:8px; }
  button.reset { background:#fee2e2; color:#991b1b; border:none; border-radius:8px; padding:6px 12px; font-size:16px; cursor:pointer; margin-top:6px; }
  .center { text-align:center; }
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tile { perspective:700px; aspect-ratio:4/3; cursor:pointer; border:none; background:none; padding:0; }
  .tile .in { position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; }
  .tile.up .in, .tile.ok .in { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; font-weight:bold; padding:4px; line-height:1.15; overflow:hidden; }
  .back { background:linear-gradient(135deg,#8b5cf6,#6d28d9); color:#fde68a; font-size:40px; border:3px solid #5b21b6; }
  .front { transform:rotateY(180deg); border:3px solid #cbd5e1; background:#fff; font-size:26px; }
  .front.en { color:#1d4ed8; direction:ltr; font-size:28px; }
  .front.he { color:#b45309; background:#fffbeb; }
  .tile.ok .front { background:#dcfce7; border-color:var(--ok); }
  .tile.bad .front { background:#fee2e2; border-color:var(--bad); }
  .tile.ok { cursor:default; }
  .fb { margin-top:12px; padding:12px; border-radius:12px; font-size:24px; text-align:center; min-height:56px; }
  .fb.ok { background:#dcfce7; color:#14532d; } .fb.no { background:#fee2e2; color:#7f1d1d; }
  .big { font-size:60px; }
  table.res { margin:10px auto; border-collapse:collapse; }
  table.res td { padding:6px 16px; border-bottom:1px solid #e5e7eb; }
  .pop { animation:pop .7s ease-out; display:inline-block; }
  @keyframes pop { 0% { transform:scale(.2); opacity:0; } 60% { transform:scale(1.5); } 100% { transform:scale(1); opacity:1; } }
  @media (max-width:600px) {
    body { font-size:19px; } header { font-size:21px; padding:10px 12px; } main { padding:10px; }
    .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .lvl { padding:10px 6px; font-size:17px; } .lvl .ic { font-size:30px; } .lvl .best { font-size:14px; }
    .card { padding:10px; } .top { font-size:16px; } button.menu { font-size:15px; padding:6px 10px; }
    .board { gap:6px; }
    .back { font-size:28px; border-width:2px; }
    .front { font-size:15px; border-width:2px; } .front.en { font-size:16px; }
    .fb { font-size:18px; padding:8px; } button.go { font-size:19px; padding:10px 14px; }
  }
</style>
</head>
<body>
<header>🃏 משחק זיכרון באנגלית – כיתה ד׳</header>
<main id="app"></main>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
