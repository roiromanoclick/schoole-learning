<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חזרה לכפל ה׳">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>חזרה למבחן בכפל – כיתה ה׳</title>
<style>
  /* Safari / iOS: כפתורים וקלטים יורשים צבע וגופן, בלי עיצוב מערכת */
  button, input { font-family:inherit; }
  button { color:inherit; -webkit-tap-highlight-color:transparent; }
  input[type=text] { -webkit-appearance:none; appearance:none; border-radius:10px; }
  input:disabled { -webkit-text-fill-color:currentColor; opacity:1; color:inherit; }
  :root { --bg:#fff7e6; --card:#fff; --main:#15803d; --ok:#16a34a; --bad:#dc2626; --ink:#1f2937; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Arial", "Heebo", sans-serif; background:var(--bg); color:var(--ink); font-size:24px; }
  header { background:var(--main); color:#fff; padding:14px 20px; text-align:center; font-size:30px; font-weight:bold; }
  header .who { font-size:24px; margin-top:6px; color:#fde68a; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .ltr { direction:ltr; unicode-bidi:isolate; display:inline-block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .topic { background:var(--card); border:3px solid #e5e7eb; border-radius:16px; padding:16px; cursor:pointer; text-align:center; transition:.15s; }
  .topic:hover { border-color:var(--main); transform:translateY(-2px); }
  .topic .ic { font-size:40px; }
  .topic .nm { font-size:24px; font-weight:bold; margin:6px 0; }
  .topic .best { font-size:18px; color:#6b7280; }
  .mock { background:#f59e0b; color:#fff; border:none; border-radius:16px; width:100%; padding:16px; font-size:24px; font-weight:bold; cursor:pointer; margin-bottom:16px; }
  .card { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 8px #0002; }
  .top { display:flex; justify-content:space-between; color:#6b7280; font-size:20px; margin-bottom:10px; }
  .bar { height:10px; background:#e5e7eb; border-radius:5px; overflow:hidden; margin-bottom:14px; }
  .bar > div { height:100%; background:var(--main); transition:.3s; }
  .prompt { font-size:30px; line-height:1.6; margin-bottom:12px; }
  .visual { text-align:center; margin:10px 0 16px; }
  .vert { font-family:"Courier New",monospace; font-size:40px; line-height:1.3; white-space:pre; background:#f9fafb; display:inline-block; padding:10px 22px; border-radius:10px; text-align:left; }
  .words { font-size:32px; font-weight:bold; color:#7c3aed; background:#f5f3ff; padding:12px; border-radius:10px; }
  .answers { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:10px 0; }
  .answers label { display:flex; flex-direction:column; align-items:center; font-size:20px; gap:4px; }
  input[type=text] { direction:ltr; text-align:center; font-size:34px; width:170px; padding:8px; border:3px solid #cbd5e1; border-radius:10px; }
  input[type=text]:focus { outline:none; border-color:var(--main); }
  .opts { display:grid; gap:10px; }
  .opt { font-size:28px; padding:12px; border:3px solid #cbd5e1; border-radius:12px; background:#fff; cursor:pointer; }
  .opt:hover:not([disabled]) { border-color:var(--main); background:#eff6ff; }
  .opt.good { background:#dcfce7; border-color:var(--ok); }
  .opt.bad { background:#fee2e2; border-color:var(--bad); }
  button.go { background:var(--main); color:#fff; border:none; border-radius:12px; padding:12px 28px; font-size:26px; cursor:pointer; margin-top:8px; }
  button.go:disabled { background:#9ca3af; }
  button.ghost { background:none; border:none; color:var(--main); font-size:22px; cursor:pointer; text-decoration:underline; }
  .center { text-align:center; }
  .fb { margin-top:14px; padding:14px; border-radius:12px; font-size:24px; line-height:1.6; }
  .fb.ok { background:#dcfce7; color:#14532d; }
  .fb.no { background:#fee2e2; color:#7f1d1d; }
  .frac { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 4px; font-weight:bold; line-height:1.1; }
  .frac span:first-child { border-bottom:3px solid currentColor; padding:0 6px; }
  svg .cell { fill:#fff; stroke:#374151; stroke-width:2; }
  svg .cell.on { fill:#fbbf24; }
  svg .click .cell { cursor:pointer; }
  .hl { background:#fde047; border-radius:4px; padding:0 3px; }
  table.res { margin:10px auto; border-collapse:collapse; }
  table.res td { padding:6px 14px; border-bottom:1px solid #e5e7eb; }
  table.vg { border-collapse:collapse; margin:0 auto; }
  .vg td { width:62px; height:60px; text-align:center; font:bold 42px "Courier New",monospace; padding:0; }
  .vg td.op { width:52px; font-size:46px; color:#1d4ed8; vertical-align:middle; }
  .vg .cr { font-size:24px; color:#b45309; }
  .vg .pop, .pop { color:#16a34a; animation:pop .7s ease-out; display:inline-block; }
  .demo-body { animation:fadein .5s ease-out; }
  @keyframes pop { 0% { transform:scale(.2); opacity:0; } 60% { transform:scale(1.6); } 100% { transform:scale(1); opacity:1; } }
  @keyframes fadein { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .vg td.ul { border-bottom:4px solid #111; }
  .vg input[type=text] { width:56px; font-size:36px; padding:2px; }
  .vg input.scratch { width:58px; font-size:22px; padding:1px; border:2px dashed #94a3b8; background:#fffbeb; color:#b45309; }
  .hint { font-size:19px; color:#6b7280; margin-bottom:8px; }
  .demo { margin-top:12px; border:3px dashed #f59e0b; background:#fffbeb; border-radius:14px; padding:14px; }
  .demo-top { font-size:18px; color:#b45309; margin-bottom:8px; font-weight:bold; }
  .demo-body { font-size:26px; line-height:1.7; text-align:center; margin-bottom:8px; }
  .demo .vert { font-size:34px; margin:6px 0; }
  .overlay { position:fixed; top:0; right:0; bottom:0; left:0; background:#0008; display:flex; align-items:center; justify-content:center; z-index:10; }
  .dlg { background:#fff; border-radius:16px; padding:22px; width:min(380px,90vw); text-align:center; }
  .dlg input { display:block; width:100%; margin:10px 0; text-align:center; font-size:22px; padding:8px; border:3px solid #cbd5e1; border-radius:10px; direction:ltr; }
  .dlg .err { color:var(--bad); min-height:24px; }
  .dots { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px; }
  .dot { width:40px; height:40px; border-radius:50%; border:2px solid #cbd5e1; background:#fff; font-size:18px; cursor:pointer; }
  .dot.cur { border-color:var(--main); box-shadow:0 0 0 3px #bfdbfe; font-weight:bold; }
  .dot.ok { background:#bbf7d0; } .dot.no { background:#fecaca; } .dot.try { background:#fef08a; }
  .nav { display:flex; justify-content:space-between; gap:10px; margin-top:16px; border-top:2px solid #f3f4f6; padding-top:12px; }
  .topic .prog { color:#16a34a; font-weight:bold; }
  .top { align-items:center; }
  button.menu { background:#e0e7ff; color:#3730a3; border:none; border-radius:10px; padding:8px 14px; font-size:20px; font-weight:bold; cursor:pointer; }
  button.menu:hover { background:#c7d2fe; }
  button.reset { background:#fee2e2; color:#991b1b; border:none; border-radius:8px; padding:6px 12px; font-size:16px; cursor:pointer; margin-top:6px; }
  button.reset:hover { background:#fecaca; }
  .topic { position:relative; }
  .topic.done { background:#dcfce7; border-color:#16a34a; }
  .topic .tick { position:absolute; top:8px; right:10px; background:#16a34a; color:#fff; width:32px; height:32px; border-radius:50%; font-size:20px; line-height:32px; font-weight:bold; }
  .mock.done { background:#16a34a; }
  .doneBanner { background:#16a34a; color:#fff; display:inline-block; padding:6px 22px; border-radius:20px; font-size:28px; font-weight:bold; margin-bottom:8px; }
  .topic .tick { width:auto !important; padding:0 12px; border-radius:16px !important; font-size:18px !important; }
  .vg td.cross { cursor:pointer; border-radius:8px; }
  .vg td.cross:hover { background:#fee2e2; }
  .vg td.cross.x { color:#dc2626; text-decoration:line-through; text-decoration-thickness:4px; }
  .big { font-size:60px; }
  html { -webkit-text-size-adjust:100%; }
  body { overflow-x:hidden; }
  button, .topic, .opt, .dot { touch-action:manipulation; }
  svg { max-width:100%; height:auto; }
  @media (max-width:600px) {
    body { font-size:19px; }
    header { font-size:21px; padding:10px 12px; }
    main { padding:10px; }
    .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .topic { padding:10px 6px; border-width:2px; }
    .topic .ic { font-size:30px; }
    .topic .nm { font-size:17px; margin:4px 0; }
    .topic .best { font-size:14px; }
    .topic .tick { font-size:14px !important; padding:0 8px; height:26px; line-height:26px; width:auto; }
    .mock { font-size:19px; padding:12px; }
    .card { padding:12px; border-radius:14px; }
    .top { font-size:15px; flex-wrap:wrap; gap:6px; }
    button.menu { font-size:15px; padding:6px 10px; }
    .dots { gap:3px; margin-bottom:10px; }
    .dot { width:30px; height:30px; font-size:14px; }
    .prompt { font-size:21px; line-height:1.5; }
    .words { font-size:21px; padding:8px; }
    .hint { font-size:15px; }
    .vert { font-size:26px; padding:8px 12px; }
    .vg td { width:min(62px,11vw); height:min(60px,11vw); font-size:min(42px,7.5vw); }
    .vg td.op { width:min(52px,8vw); font-size:min(46px,8vw); }
    .vg .cr { font-size:min(24px,4.5vw); }
    .vg input[type=text] { width:min(56px,10vw); font-size:max(16px,min(36px,7vw)); }
    .vg input.scratch { width:min(58px,10vw); font-size:max(16px,min(22px,4.5vw)); }
    input[type=text] { font-size:26px; width:130px; padding:6px; }
    .answers { gap:8px; }
    .answers label { font-size:16px; }
    .opt { font-size:20px; padding:10px; }
    button.go { font-size:19px; padding:10px 14px; }
    .nav { gap:8px; }
    .nav button.go { flex:1; }
    button.ghost { font-size:16px; }
    .fb { font-size:18px; padding:10px; }
    .demo { padding:10px; }
    .demo-body { font-size:20px; }
    .demo .vert { font-size:24px; }
    .demo .go { font-size:16px; padding:8px 10px; }
    .big { font-size:48px; }
    table.res td { padding:5px 8px; font-size:17px; }
    .dlg { padding:16px; }
  }
</style>
</head>
<body>
<header>🧮 חזרה למבחן בכפל – כיתה ה׳</header>
<main id="app"></main>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
